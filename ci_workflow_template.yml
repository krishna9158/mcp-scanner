# MCP Security Scan - GitHub Actions workflow template
#
# HOW TO USE THIS:
# 1. Push this scanner's own code (all these .py files + requirements.txt)
#    to a GitHub repo of your own - e.g. yourname/mcp-scanner.
# 2. In the repo you actually want to scan automatically, create the file
#    .github/workflows/mcp-security-scan.yml and paste this content in.
# 3. Replace YOUR_GITHUB_USERNAME/mcp-scanner below with wherever you
#    pushed the scanner in step 1.
# 4. Commit and push - it'll now run on every push and pull request, and
#    FAIL THE BUILD automatically if the scan comes back RED.

name: MCP Security Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo being scanned
        uses: actions/checkout@v4
        with:
          path: target-repo

      - name: Check out the MCP scanner
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/mcp-scanner   # <-- change this
          path: scanner

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: pip install -r scanner/requirements.txt

      # --- STRICT MODE: fail on any finding above configured thresholds ---
      # Uses fine-grained thresholds (Feature 5) instead of only --fail-on RED.
      - name: Run MCP security scan (strict thresholds)
        run: |
          python scanner/ci_scan.py target-repo \
            --json-out scan-results.json \
            --fail-on RED \
            --fail-on-secret HIGH \
            --fail-on-dependency HIGH \
            --fail-on-typosquat MEDIUM \
            --fail-on-tool YELLOW \
            --fail-on-injection MEDIUM \
            --fail-on-shadowing HIGH

      # --- LENIENT MODE (uncomment to use instead of strict) ---
      # - name: Run MCP security scan (lenient thresholds)
      #   run: |
      #     python scanner/ci_scan.py target-repo \
      #       --json-out scan-results.json \
      #       --fail-on RED \
      #       --fail-on-secret CRITICAL \
      #       --fail-on-dependency CRITICAL \
      #       --fail-on-typosquat LOW \
      #       --fail-on-tool RED \
      #       --fail-on-injection HIGH \
      #       --fail-on-shadowing CRITICAL

      - name: Upload full scan results
        if: always()   # upload even if the scan step above failed the build
        uses: actions/upload-artifact@v4
        with:
          name: mcp-scan-results
          path: scan-results.json
